# 服务器配置
server:
  # HTTP服务配置
  http:
    port: 8080
    read_timeout: 10s
    write_timeout: 10s
    idle_timeout: 60s
  # WebSocket服务配置
  websocket:
    port: 9501
    read_buffer_size: 4096
    write_buffer_size: 4096
    ping_interval: 30s
    ping_timeout: 10s
    max_message_size: 8192

# 数据库配置
database:
  driver: mysql
  host: localhost
  port: 3306
  username: root
  password: root
  dbname: go_ddz
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600s

# Redis配置
redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

# NATS配置
nats:
  url: nats://localhost:4222
  max_reconnects: 10
  reconnect_wait: 5s

# 日志配置
log:
  level: debug  # debug, info, warn, error
  format: json  # json, console
  output: stdout  # stdout, file
  file_path: ./logs/app.log

# 游戏配置
game:
  # 房间配置
  room:
    max_player_count: 3
    ready_timeout: 30s
    turn_timeout: 30s
  # AI配置
  ai:
    difficulty_level: 2  # 1-简单, 2-中等, 3-困难
    response_delay: 1s 