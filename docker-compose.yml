services:
  postgres:
    image: postgres:16-alpine
    container_name: ddz-postgres
    environment:
      POSTGRES_DB: ddz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - ddz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ddz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ddz-postgres-data:
